<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reportes de equipos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#18212C; --muted:#5A6676; --line:#D3D9E0;
  --brand:#0E5C63; --brand-ink:#FFFFFF; --brand-soft:#DCEDEE;
  --hold:#9A6212; --hold-bg:#FBEFD9; --limit:#B3261E; --limit-bg:#FBE3E1;
  --pip:#C9D1DA;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12171D; --surface:#1A2129; --ink:#E7ECF1; --muted:#9AA6B4; --line:#2C3641;
  --brand:#4FB3BA; --brand-ink:#08262A; --brand-soft:#16363A;
  --hold:#F0B860; --hold-bg:#3A2C14; --limit:#FF8A80; --limit-bg:#3D1C1A;
  --pip:#36414D; color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;line-height:1.2;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}

/* Barra superior */
header{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bar h1{font-size:1.15rem;font-weight:800}
.ciclo{color:var(--muted);font-size:.9rem}
.who{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.9rem}
nav{max-width:1200px;margin:auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:700;white-space:nowrap}
nav button[aria-current="page"]{color:var(--ink);border-color:var(--brand)}
nav .count{display:inline-block;min-width:1.5em;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--hold-bg);color:var(--hold);font-size:.8rem}

main{max-width:1200px;margin:auto;padding:24px 20px 60px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* Panorama */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:28px}
.fig{background:var(--surface);padding:16px 18px}
.fig b{display:block;font:800 2.2rem/1 Archivo,sans-serif}
.fig span{color:var(--muted);font-size:.92rem}
.fig.hold b{color:var(--hold)} .fig.limit b{color:var(--limit)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:28px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
section h2{font-size:1.05rem;margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.barrow{display:grid;grid-template-columns:minmax(120px,40%) 1fr 2.5em;gap:10px;align-items:center;margin:6px 0;font-size:.95rem}
.barrow i{display:block;height:10px;border-radius:2px;background:var(--brand)}
.barrow em{font-style:normal;text-align:right;font-weight:700}
.empty{color:var(--muted);padding:8px 0}

/* Tablas */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{text-align:left;font-weight:700;color:var(--muted);font-size:.85rem;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer} tbody tr.clickable:hover{background:var(--brand-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.code{font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* Strikes: el elemento distintivo */
.pips{display:inline-flex;gap:4px;align-items:center;vertical-align:middle}
.pips i{width:14px;height:14px;border-radius:3px;background:var(--pip);transform:skewX(-12deg)}
.pips i.on{background:var(--ink)}
.pips.limit i.on{background:var(--limit)}
.pips small{margin-left:4px;color:var(--limit);font-weight:700}
.pips.big i{width:26px;height:26px;border-radius:4px}

.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.82rem;font-weight:700;white-space:nowrap}
.tag.hold{background:var(--hold-bg);color:var(--hold)}
.tag.limit{background:var(--limit-bg);color:var(--limit)}
.tag.void{background:var(--bg);color:var(--muted);text-decoration:line-through}

/* Filtros */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.filters input[type=search]{flex:1 1 260px}
input[type=search],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
label.check{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

/* Ficha del alumno */
dialog{border:0;padding:0;border-radius:10px;width:min(760px,96vw);max-height:92vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,20,.55)}
.dhead{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start}
.dhead h2{font-size:1.35rem}
.dhead p{margin:4px 0 0;color:var(--muted)}
.dhead .close{margin-left:auto}
.dbody{padding:18px 22px 24px;overflow:auto;max-height:calc(92vh - 90px)}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 20px;margin-bottom:18px}
.datos div span{display:block;color:var(--muted);font-size:.85rem}
.strikebox{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:8px;margin-bottom:18px}
.banner{background:var(--hold-bg);color:var(--hold);border-radius:8px;padding:12px 14px;margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:700}
form.nuevo{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;border:1px solid var(--line);border-radius:8px;margin-bottom:22px}
form.nuevo label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;font-weight:700}
form.nuevo .full{grid-column:1/-1}
@media (max-width:560px){form.nuevo{grid-template-columns:1fr}}
.hist{list-style:none;margin:0;padding:0}
.hist li{border-left:3px solid var(--line);padding:4px 0 14px 14px}
.hist li.ret{border-color:var(--hold)}
.hist li.void{opacity:.6}
.hist .meta{color:var(--muted);font-size:.88rem}
.hist .acts{margin-top:6px;display:flex;gap:12px}

/* Login */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate .panel{max-width:420px;text-align:left;padding:28px}
.gate h1{font-size:1.6rem;margin-bottom:8px}
.gate p{color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:6px;font-weight:700;z-index:99}
.note{background:var(--brand-soft);border-radius:8px;padding:12px 14px;margin:12px 0}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:in .16s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>

<div id="gate" class="gate hidden">
  <div class="panel">
    <h1>Reportes de equipos</h1>
    <p id="gateMsg">Acceso solo para coordinación y el equipo de IT.</p>
    <form id="fLogin" style="display:grid;gap:10px;margin-top:16px">
      <label for="email" style="font-weight:700">Correo del colegio</label>
      <input type="email" id="email" required autocomplete="username"
        style="background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px">
      <label for="password" style="font-weight:700">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password"
        style="background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px">
      <button class="btn primary" type="submit">Entrar</button>
    </form>
    <button id="btnLogout2" class="btn hidden">Cerrar sesión</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="bar">
      <h1>Reportes de equipos</h1>
      <span class="ciclo" id="ciclo"></span>
      <div class="who"><span id="userEmail"></span><button id="btnLogout" class="btn small">Salir</button></div>
    </div>
    <nav id="nav">
      <button data-view="panorama" aria-current="page">Panorama</button>
      <button data-view="alumnos">Alumnos</button>
      <button data-view="retenidos">Equipos retenidos<span class="count" id="cntRet">0</span></button>
      <button data-view="importar">Importar lista</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<dialog id="ficha"></dialog>

<script>
/* =====================================================================
   CONFIGURACIÓN — edita solo esta parte
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://euqiwrbiydnnaaszbrbs.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1cWl3cmJpeWRubmFhc3picmJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MTYxNDMsImV4cCI6MjEwNzk5MjE0M30.91rYzwt_Tj7GGmKLR6U0pRBTRmbUNWpy3C3RsF4RL84',
  CICLO: '2026-2027',
  LIMITE_STRIKES: 3,
  DOMINIO: 'mx.christelhouse.org',   // solo se aceptan correos de este dominio
  CATEGORIAS: [
    { nombre: 'Equipo extraviado',               strikes: 1, retiene: false },
    { nombre: 'Cargador extraviado',             strikes: 1, retiene: false },
    { nombre: 'Sitio o app prohibida',           strikes: 1, retiene: true  },
    { nombre: 'Daño al equipo',                  strikes: 1, retiene: true  },
    { nombre: 'Equipo prestado o intercambiado', strikes: 1, retiene: false },
    { nombre: 'Uso fuera de horario o lugar',    strikes: 1, retiene: false },
    { nombre: 'Otro',                            strikes: 1, retiene: false },
  ],
};
/* ===================================================================== */

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const state = { user: null, alumnos: [], reportes: [], byId: new Map(), view: 'panorama',
  f: { q: '', grado: '', grupo: '', solo: false }, abierto: null };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy = () => new Date().toLocaleDateString('en-CA');
const fFecha = f => f ? new Date(f.length === 10 ? f + 'T00:00:00' : f).toLocaleDateString('es-MX', { day:'numeric', month:'short', year:'numeric' }) : '';
const dias = f => Math.max(0, Math.floor((Date.now() - new Date(f + 'T00:00:00')) / 864e5));
const nombre = a => a ? `${a.apellido_paterno ?? ''} ${a.apellido_materno ?? ''}, ${a.nombres ?? ''}`.trim() : '(alumno no encontrado)';
const grupoDe = a => a ? `${a.grado ?? ''}°${a.grupo ?? ''}` : '';
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.append(t); setTimeout(()=>t.remove(), 2600); }

/* ---------- Sesión ---------- */
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showGate('Acceso solo para coordinación y el equipo de IT.', false);
  state.user = session.user;
  const { data: ok, error } = await sb.rpc('es_staff');
  if (error || !ok) return showGate(`La cuenta ${session.user.email} no tiene acceso. Pide que la agreguen a la lista de staff.`, true);
  $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#userEmail').textContent = session.user.email;
  $('#ciclo').textContent = 'Ciclo ' + CONFIG.CICLO;
  await load(); render();
}
function showGate(msg, logged){
  $('#app').classList.add('hidden'); $('#gate').classList.remove('hidden');
  $('#gateMsg').textContent = msg;
  $('#fLogin').classList.toggle('hidden', logged);
  $('#btnLogout2').classList.toggle('hidden', !logged);
}
$('#fLogin').onsubmit = async e => {
  e.preventDefault();
  const email = $('#email').value.trim().toLowerCase();
  if (CONFIG.DOMINIO && !email.endsWith('@' + CONFIG.DOMINIO)) { $('#gateMsg').textContent = `Usa tu correo @${CONFIG.DOMINIO}.`; return; }
  const btn = $('#fLogin button'); btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password: $('#password').value });
  btn.disabled = false;
  if (error) { $('#gateMsg').textContent = 'Correo o contraseña incorrectos.'; return; }
  boot();
};
const logout = async () => { await sb.auth.signOut(); location.reload(); };
$('#btnLogout').onclick = logout; $('#btnLogout2').onclick = logout;

/* ---------- Datos ---------- */
async function load(){
  const [a, r] = await Promise.all([
    sb.from('alumnos').select('*').eq('activo', true).order('grado').order('grupo').order('num_lista').range(0, 4999),
    sb.from('reportes').select('*')
      .or(`ciclo.eq.${CONFIG.CICLO},and(equipo_retenido.eq.true,devuelto_en.is.null,anulado.eq.false)`)
      .order('fecha', { ascending: false }).order('created_at', { ascending: false }).range(0, 9999),
  ]);
  if (a.error || r.error) { toast('No se pudieron cargar los datos'); console.error(a.error || r.error); return; }
  state.alumnos = a.data; state.reportes = r.data;
  state.byId = new Map(a.data.map(x => [x.id, x]));
}
const delCiclo = () => state.reportes.filter(r => r.ciclo === CONFIG.CICLO && !r.anulado);
const strikesDe = id => delCiclo().filter(r => r.alumno_id === id).reduce((s, r) => s + r.strikes, 0);
const retenidos = () => state.reportes.filter(r => r.equipo_retenido && !r.devuelto_en && !r.anulado);
const retencionDe = id => retenidos().find(r => r.alumno_id === id);

function pips(n, big){
  const L = CONFIG.LIMITE_STRIKES, lim = n >= L;
  let h = `<span class="pips${lim ? ' limit' : ''}${big ? ' big' : ''}" role="img" aria-label="${n} de ${L} strikes">`;
  for (let i = 0; i < L; i++) h += `<i class="${i < n ? 'on' : ''}"></i>`;
  if (n > L) h += `<small>+${n - L}</small>`;
  return h + '</span>';
}

/* ---------- Navegación ---------- */
$('#nav').onclick = e => { const b = e.target.closest('button[data-view]'); if (!b) return; state.view = b.dataset.view; render(); };
function render(){
  document.querySelectorAll('#nav button').forEach(b => b.toggleAttribute('aria-current', b.dataset.view === state.view));
  document.querySelectorAll('#nav button[aria-current]').forEach(b => b.setAttribute('aria-current', 'page'));
  $('#cntRet').textContent = retenidos().length;
  ({ panorama: vPanorama, alumnos: vAlumnos, retenidos: vRetenidos, importar: vImportar })[state.view]();
}

/* ---------- Panorama ---------- */
function vPanorama(){
  const rs = delCiclo(), ret = retenidos();
  const lim = state.alumnos.map(a => ({ a, n: strikesDe(a.id) })).filter(x => x.n >= CONFIG.LIMITE_STRIKES).sort((x, y) => y.n - x.n);
  const semana = rs.filter(r => dias(r.fecha) <= 7).length;
  const porCat = {}; rs.forEach(r => porCat[r.categoria] = (porCat[r.categoria] || 0) + 1);
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]); const max = cats[0]?.[1] || 1;
  const porGrupo = {};
  state.alumnos.forEach(a => { const g = grupoDe(a); porGrupo[g] ??= { g, rep: 0, str: 0, ret: 0, lim: 0, orden: [a.grado, a.grupo] }; });
  rs.forEach(r => { const a = state.byId.get(r.alumno_id); if (!a) return; const g = porGrupo[grupoDe(a)]; g.rep++; g.str += r.strikes; });
  ret.forEach(r => { const a = state.byId.get(r.alumno_id); if (a) porGrupo[grupoDe(a)].ret++; });
  lim.forEach(x => porGrupo[grupoDe(x.a)].lim++);
  const grupos = Object.values(porGrupo).filter(g => g.rep || g.ret).sort((x, y) => (x.orden[0] - y.orden[0]) || String(x.orden[1]).localeCompare(y.orden[1]));

  $('#view').innerHTML = `
    <div class="figs">
      <div class="fig hold"><b>${ret.length}</b><span>equipos retenidos ahora</span></div>
      <div class="fig limit"><b>${lim.length}</b><span>alumnos con ${CONFIG.LIMITE_STRIKES} strikes o más</span></div>
      <div class="fig"><b>${rs.length}</b><span>reportes en el ciclo</span></div>
      <div class="fig"><b>${semana}</b><span>reportes en los últimos 7 días</span></div>
    </div>
    <div class="cols">
      <section><h2>Motivos de los reportes</h2><div class="panel">
        ${cats.length ? cats.map(([c, n]) => `<div class="barrow"><span>${esc(c)}</span><i style="width:${(n / max * 100).toFixed(1)}%"></i><em>${n}</em></div>`).join('') : '<p class="empty">Aún no hay reportes en este ciclo.</p>'}
      </div></section>
      <section><h2>En el límite de strikes</h2><div class="panel">
        ${lim.length ? `<table><tbody>${lim.map(x => `<tr class="clickable" data-al="${x.a.id}"><td>${esc(nombre(x.a))}</td><td>${grupoDe(x.a)}</td><td>${pips(x.n)}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">Nadie ha llegado al límite.</p>'}
      </div></section>
    </div>
    <section style="margin-bottom:28px"><h2>Por grupo</h2>
      ${grupos.length ? `<div class="tablewrap"><table><thead><tr><th>Grupo</th><th class="num">Reportes</th><th class="num">Strikes</th><th class="num">Equipos retenidos</th><th class="num">En el límite</th></tr></thead><tbody>
        ${grupos.map(g => `<tr><td><button class="link" data-grupo="${esc(g.g)}">${esc(g.g)}</button></td><td class="num">${g.rep}</td><td class="num">${g.str}</td><td class="num">${g.ret || ''}</td><td class="num">${g.lim || ''}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="empty">Sin reportes todavía.</p>'}
    </section>
    <section><h2>Reportes recientes</h2>${tablaReportes(rs.slice(0, 12))}</section>`;
}
function tablaReportes(list){
  if (!list.length) return '<p class="empty">Sin reportes todavía.</p>';
  return `<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Alumno</th><th>Grupo</th><th>Motivo</th><th class="num">Strikes</th><th>Equipo</th></tr></thead><tbody>
    ${list.map(r => { const a = state.byId.get(r.alumno_id); return `<tr class="clickable" data-al="${r.alumno_id}">
      <td>${fFecha(r.fecha)}</td><td>${esc(nombre(a))}</td><td>${grupoDe(a)}</td><td>${esc(r.categoria)}</td><td class="num">${r.strikes}</td>
      <td>${r.equipo_retenido ? (r.devuelto_en ? 'Devuelto' : '<span class="tag hold">Retenido</span>') : ''}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}

/* ---------- Alumnos ---------- */
function vAlumnos(){
  const grados = [...new Set(state.alumnos.map(a => a.grado).filter(x => x != null))].sort((a, b) => a - b);
  const gruposL = [...new Set(state.alumnos.map(a => a.grupo).filter(Boolean))].sort();
  $('#view').innerHTML = `
    <div class="filters">
      <input type="search" id="fq" placeholder="Buscar por nombre, correo, No. de serie o ID de cargador" value="${esc(state.f.q)}" aria-label="Buscar">
      <select id="fgrado" aria-label="Grado"><option value="">Todos los grados</option>${grados.map(g => `<option ${String(g) === state.f.grado ? 'selected' : ''}>${g}</option>`).join('')}</select>
      <select id="fgrupo" aria-label="Grupo"><option value="">Todos los grupos</option>${gruposL.map(g => `<option ${g === state.f.grupo ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>
      <label class="check"><input type="checkbox" id="fsolo" ${state.f.solo ? 'checked' : ''}> Solo con reportes</label>
    </div>
    <div id="tabla"></div>`;
  const upd = () => { state.f = { q: $('#fq').value, grado: $('#fgrado').value, grupo: $('#fgrupo').value, solo: $('#fsolo').checked }; tablaAlumnos(); };
  ['#fq', '#fgrado', '#fgrupo', '#fsolo'].forEach(s => $(s).addEventListener('input', upd));
  tablaAlumnos();
}
function tablaAlumnos(){
  const q = state.f.q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  const list = state.alumnos.filter(a => {
    if (state.f.grado && String(a.grado) !== state.f.grado) return false;
    if (state.f.grupo && a.grupo !== state.f.grupo) return false;
    if (state.f.solo && !state.reportes.some(r => r.alumno_id === a.id && !r.anulado)) return false;
    if (!q) return true;
    return [nombre(a), a.nombres + ' ' + a.apellido_paterno, a.correo, a.serie_equipo, a.id_cargador].join(' ')
      .toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').includes(q);
  });
  if (!state.alumnos.length) { $('#tabla').innerHTML = `<p class="empty">No hay alumnos cargados. Ve a <button class="link" data-goto="importar">Importar lista</button> para subir el archivo.</p>`; return; }
  $('#tabla').innerHTML = `<p class="empty">${list.length} de ${state.alumnos.length} alumnos</p>
  <div class="tablewrap"><table><thead><tr><th>Grupo</th><th class="num">No.</th><th>Alumno</th><th>No. de serie</th><th>Cargador</th><th>Strikes</th><th>Estado</th></tr></thead><tbody>
  ${list.slice(0, 500).map(a => { const n = strikesDe(a.id), ret = retencionDe(a.id); return `<tr class="clickable" data-al="${a.id}">
    <td>${grupoDe(a)}</td><td class="num">${a.num_lista ?? ''}</td><td>${esc(nombre(a))}</td><td class="code">${esc(a.serie_equipo)}</td><td class="code">${esc(a.id_cargador)}</td>
    <td>${pips(n)}</td><td>${ret ? `<span class="tag hold">Retenido · ${dias(ret.fecha)} d</span>` : ''} ${n >= CONFIG.LIMITE_STRIKES ? '<span class="tag limit">En el límite</span>' : ''}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}

/* ---------- Retenidos ---------- */
function vRetenidos(){
  const list = retenidos().slice().sort((a, b) => a.fecha.localeCompare(b.fecha));
  $('#view').innerHTML = !list.length ? '<p class="empty">No hay equipos retenidos en este momento.</p>' :
  `<div class="tablewrap"><table><thead><tr><th>Desde</th><th class="num">Días</th><th>Alumno</th><th>Grupo</th><th>No. de serie</th><th>Cargador</th><th>Motivo</th><th></th></tr></thead><tbody>
  ${list.map(r => { const a = state.byId.get(r.alumno_id); return `<tr>
    <td>${fFecha(r.fecha)}</td><td class="num">${dias(r.fecha)}</td><td><button class="link" data-al="${r.alumno_id}">${esc(nombre(a))}</button></td><td>${grupoDe(a)}</td>
    <td class="code">${esc(a?.serie_equipo)}</td><td class="code">${esc(a?.id_cargador)}</td><td>${esc(r.categoria)}</td>
    <td><button class="btn small" data-devolver="${r.id}">Marcar devuelto</button></td></tr>`; }).join('')}
  </tbody></table></div>`;
}

/* ---------- Ficha del alumno ---------- */
function abrirFicha(id){
  state.abierto = id; const a = state.byId.get(id); if (!a) return;
  const n = strikesDe(id), ret = retencionDe(id);
  const hist = state.reportes.filter(r => r.alumno_id === id);
  const cat0 = CONFIG.CATEGORIAS[0];
  const d = $('#ficha');
  d.innerHTML = `
    <div class="dhead"><div><h2>${esc(a.nombres)} ${esc(a.apellido_paterno)} ${esc(a.apellido_materno)}</h2><p>${grupoDe(a)} · No. de lista ${a.num_lista ?? '—'}</p></div>
      <button class="btn small close" data-cerrar>Cerrar</button></div>
    <div class="dbody">
      <div class="datos">
        <div><span>Correo</span>${esc(a.correo)}</div>
        <div><span>No. de serie del equipo</span><span class="code" style="color:inherit;font-size:1rem">${esc(a.serie_equipo) || '—'}</span></div>
        <div><span>ID del cargador</span><span class="code" style="color:inherit;font-size:1rem">${esc(a.id_cargador) || '—'}</span></div>
      </div>
      <div class="strikebox">${pips(n, true)}<div><b>${n} de ${CONFIG.LIMITE_STRIKES} strikes</b><br><span class="empty" style="padding:0">Ciclo ${CONFIG.CICLO}</span></div></div>
      ${ret ? `<div class="banner">Equipo retenido desde el ${fFecha(ret.fecha)} (${dias(ret.fecha)} días) por ${esc(ret.categoria).toLowerCase()} <button class="btn small" data-devolver="${ret.id}">Marcar devuelto</button></div>` : ''}
      <form class="nuevo" id="fNuevo">
        <h3 class="full" style="font-size:1rem">Levantar reporte</h3>
        <label>Motivo<select name="categoria">${CONFIG.CATEGORIAS.map(c => `<option>${esc(c.nombre)}</option>`).join('')}</select></label>
        <label>Fecha<input type="date" name="fecha" value="${hoy()}" max="${hoy()}" required></label>
        <label>Strikes<select name="strikes">${[0, 1, 2, 3].map(x => `<option ${x === cat0.strikes ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
        <label class="check" style="flex-direction:row;align-self:end;padding-bottom:8px"><input type="checkbox" name="retenido" ${cat0.retiene ? 'checked' : ''} ${ret ? 'disabled' : ''}> Se le retiene el equipo</label>
        <label class="full">Qué pasó<textarea name="descripcion" rows="3" placeholder="Describe lo ocurrido: dónde, cuándo y quién lo detectó"></textarea></label>
        <div class="full"><button class="btn primary" type="submit">Guardar reporte</button></div>
      </form>
      <h3 style="font-size:1rem;margin-bottom:10px">Historial</h3>
      ${hist.length ? `<ul class="hist">${hist.map(r => `<li class="${r.anulado ? 'void' : r.equipo_retenido ? 'ret' : ''}">
        <b>${esc(r.categoria)}</b> · ${r.strikes} strike${r.strikes === 1 ? '' : 's'} ${r.anulado ? '<span class="tag void">Anulado</span>' : ''}
        ${r.equipo_retenido && !r.anulado ? (r.devuelto_en ? `<span class="tag">Devuelto el ${fFecha(r.devuelto_en)}</span>` : '<span class="tag hold">Retenido</span>') : ''}
        <div class="meta">${fFecha(r.fecha)} · registró ${esc(r.registrado_por)}${r.ciclo !== CONFIG.CICLO ? ' · ciclo ' + esc(r.ciclo) : ''}</div>
        ${r.descripcion ? `<div>${esc(r.descripcion)}</div>` : ''}
        ${r.anulado ? `<div class="meta">Motivo de anulación: ${esc(r.motivo_anulacion)}</div>` : `<div class="acts"><button class="link" data-anular="${r.id}">Anular</button></div>`}
      </li>`).join('')}</ul>` : '<p class="empty">Sin reportes.</p>'}
    </div>`;
  const f = $('#fNuevo');
  f.categoria.onchange = () => { const c = CONFIG.CATEGORIAS.find(c => c.nombre === f.categoria.value); f.strikes.value = c.strikes; if (!f.retenido.disabled) f.retenido.checked = c.retiene; };
  f.onsubmit = async e => {
    e.preventDefault(); const btn = f.querySelector('[type=submit]'); btn.disabled = true;
    const { data, error } = await sb.from('reportes').insert({
      alumno_id: id, fecha: f.fecha.value, ciclo: CONFIG.CICLO, categoria: f.categoria.value,
      descripcion: f.descripcion.value.trim() || null, strikes: +f.strikes.value, equipo_retenido: f.retenido.checked && !f.retenido.disabled,
    }).select().single();
    btn.disabled = false;
    if (error) { toast('No se guardó el reporte: ' + error.message); return; }
    state.reportes.unshift(data); toast('Reporte guardado'); abrirFicha(id); render();
  };
  if (!d.open) d.showModal();
}

/* ---------- Acciones ---------- */
async function devolver(rid){
  if (!confirm('¿Confirmas que el equipo ya se devolvió al alumno?')) return;
  const { data, error } = await sb.from('reportes').update({ devuelto_en: new Date().toISOString() }).eq('id', rid).select().single();
  if (error) return toast('No se pudo actualizar: ' + error.message);
  Object.assign(state.reportes.find(r => r.id === rid), data); toast('Equipo marcado como devuelto');
  render(); if ($('#ficha').open) abrirFicha(state.abierto);
}
async function anular(rid){
  const motivo = prompt('¿Por qué se anula este reporte? (queda registrado)'); if (!motivo || !motivo.trim()) return;
  const { data, error } = await sb.from('reportes').update({ anulado: true, motivo_anulacion: motivo.trim() }).eq('id', rid).select().single();
  if (error) return toast('No se pudo anular: ' + error.message);
  Object.assign(state.reportes.find(r => r.id === rid), data); toast('Reporte anulado');
  render(); if ($('#ficha').open) abrirFicha(state.abierto);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-devolver],[data-anular],[data-al],[data-cerrar],[data-grupo],[data-goto]'); if (!t) return;
  if (t.dataset.devolver) return devolver(t.dataset.devolver);
  if (t.dataset.anular) return anular(t.dataset.anular);
  if (t.dataset.cerrar !== undefined) return $('#ficha').close();
  if (t.dataset.goto) { state.view = t.dataset.goto; return render(); }
  if (t.dataset.grupo) { const m = t.dataset.grupo.match(/^(\d*)°(.*)$/); state.f = { q: '', grado: m?.[1] || '', grupo: m?.[2] || '', solo: true }; state.view = 'alumnos'; return render(); }
  if (t.dataset.al) return abrirFicha(t.dataset.al);
});

/* ---------- Importar lista ---------- */
// Reconoce las columnas por su encabezado. La de contraseñas se descarta al leer el archivo:
// nunca entra a la memoria de la app ni se envía a la base de datos.
function campo(h){
  const n = String(h).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
  if (n.includes('contrasen') || n.includes('password') || n === 'pass' || n === 'clave') return '__descartar';
  if (n.includes('paterno')) return 'apellido_paterno';
  if (n.includes('materno')) return 'apellido_materno';
  if (n.includes('serie')) return 'serie_equipo';
  if (n.includes('cargador')) return 'id_cargador';
  if (n.includes('correo') || n.includes('email') || n.includes('mail')) return 'correo';
  if (n.includes('lista')) return 'num_lista';
  if (n.startsWith('grado')) return 'grado';
  if (n.startsWith('grupo')) return 'grupo';
  if (n.startsWith('nombre')) return 'nombres';
  return null;
}
let pendientes = [];
function vImportar(){
  $('#view').innerHTML = `
    <section style="max-width:760px"><h2>Importar lista de alumnos</h2>
      <p>Sube el archivo de Excel o CSV con las columnas: grado, grupo, No. de lista, apellido paterno, apellido materno, nombre(s), No. de serie del equipo, ID del cargador y correo.</p>
      <div class="note">Si el archivo trae la columna de contraseñas, se descarta al leerlo y no se guarda en ningún lado. Aun así, lo más seguro es borrarla del archivo antes de subirlo.</div>
      <p>Si un correo ya existe, se actualizan sus datos (útil cuando cambian equipos o grupos). Los reportes no se tocan.</p>
      <input type="file" id="archivo" accept=".xlsx,.xls,.csv">
      <div id="prev" style="margin-top:18px"></div>
    </section>`;
  $('#archivo').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    let filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: false });
    const headers = Object.keys(filas[0] || {});
    const mapa = Object.fromEntries(headers.map(h => [h, campo(h)]));
    const descartadas = headers.filter(h => mapa[h] === '__descartar');
    const ignoradas = headers.filter(h => mapa[h] === null);
    const porCorreo = new Map();
    for (const f of filas) {
      const o = {};
      for (const h of headers) { const c = mapa[h]; if (c && c !== '__descartar') o[c] = String(f[h]).trim(); }
      if (!o.correo) continue;
      o.correo = o.correo.toLowerCase();
      o.grado = parseInt(o.grado) || null; o.num_lista = parseInt(o.num_lista) || null;
      ['grupo', 'apellido_paterno', 'apellido_materno', 'nombres', 'serie_equipo', 'id_cargador'].forEach(k => o[k] = o[k] || null);
      o.activo = true;
      porCorreo.set(o.correo, o);
    }
    filas = null; // se libera el archivo original, incluidas las columnas descartadas
    pendientes = [...porCorreo.values()];
    const faltan = ['correo', 'nombres', 'apellido_paterno', 'grado', 'grupo'].filter(c => !Object.values(mapa).includes(c));
    $('#prev').innerHTML = `
      <p><b>${pendientes.length} alumnos listos para importar.</b></p>
      ${descartadas.length ? `<p>Columna descartada: ${descartadas.map(esc).join(', ')}.</p>` : ''}
      ${ignoradas.length ? `<p>Columnas no reconocidas (no se importan): ${ignoradas.map(esc).join(', ')}.</p>` : ''}
      ${faltan.length ? `<p class="tag limit">No se encontraron las columnas: ${faltan.join(', ')}. Revisa los encabezados.</p>` : ''}
      <div class="tablewrap" style="margin:12px 0"><table><thead><tr><th>Grupo</th><th>No.</th><th>Alumno</th><th>Correo</th><th>Serie</th><th>Cargador</th></tr></thead><tbody>
        ${pendientes.slice(0, 5).map(a => `<tr><td>${grupoDe(a)}</td><td>${a.num_lista ?? ''}</td><td>${esc(nombre(a))}</td><td>${esc(a.correo)}</td><td class="code">${esc(a.serie_equipo)}</td><td class="code">${esc(a.id_cargador)}</td></tr>`).join('')}
      </tbody></table></div>
      <button class="btn primary" id="btnImp" ${!pendientes.length || faltan.includes('correo') ? 'disabled' : ''}>Importar ${pendientes.length} alumnos</button>`;
    e.target.value = '';
    $('#btnImp').onclick = async () => {
      const b = $('#btnImp'); b.disabled = true;
      for (let i = 0; i < pendientes.length; i += 200) {
        b.textContent = `Importando ${Math.min(i + 200, pendientes.length)} de ${pendientes.length}…`;
        const { error } = await sb.from('alumnos').upsert(pendientes.slice(i, i + 200), { onConflict: 'correo' });
        if (error) { toast('Error al importar: ' + error.message); b.disabled = false; b.textContent = 'Reintentar'; return; }
      }
      pendientes = []; await load(); toast('Lista importada'); state.view = 'alumnos'; render();
    };
  };
}

boot();
</script>
</body>
</html>
